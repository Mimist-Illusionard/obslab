global:
  scrape_interval:     10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'reddit-clone'
    static_configs:
      - targets:
          - 'reddit:8080'

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-exporter:9100'

rule_files:
  - 'alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093