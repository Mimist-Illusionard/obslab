global:
  telegram_api_url: "https://api.telegram.org"
  resolve_timeout: 2m

route:
  group_by:
    - "alertname"
  group_wait: 30s
  group_interval: 10s
  repeat_interval: 20s
  receiver: "telegram-bot"
receivers:
  - name: "telegram-bot"
    telegram_configs:
      - chat_id_file: /etc/alertmanager/token.txt
        bot_token_file: /etc/alertmanager/chat-id.txt
        send_resolved: true